<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>EmpleoYa | Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style-login.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white py-3 shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Empleo<span class="text-primary">Ya</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active fw-semibold" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="#ofertas">Buscar Empleos</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Empresas</a></li>
      </ul>
      
      <div class="d-flex gap-2 align-items-center" id="navAuthButtons">
        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
      </div>
    </div>
  </div>
</nav>

<div class="container mt-4 mb-5">
  <div class="row justify-content-center text-center mb-4">
    <div class="col-md-8">
      <h1 class="fw-bold display-6">Bienvenido a Empleo<span class="text-primary">Ya</span></h1>
      <p class="text-muted fs-5">Tu próximo paso profesional te espera</p>
    </div>
  </div>

  <div class="row justify-content-center align-items-center g-4">
    <div class="col-auto d-none d-md-block">
      <div class="icon-circle" id="iconCandidato">
        <i class="bi bi-person-fill"></i>
      </div>
    </div>

    <!-- Formulario central con animación -->
    <div class="col-md-6 col-lg-5">
      <div class="form-container-box">
        <ul class="nav nav-pills mb-4 justify-content-center" id="loginRoleTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="candidato-tab" data-bs-toggle="pill" data-bs-target="#candidatoPanel" type="button" role="tab">Soy Candidato</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="empresa-tab" data-bs-toggle="pill" data-bs-target="#empresaPanel" type="button" role="tab">Soy Empresa</button>
          </li>
        </ul>

        <div class="tab-content animated-tabs" id="loginTabContent">
          <!-- Panel Candidato -->
          <div class="tab-pane fade show active" id="candidatoPanel" role="tabpanel">
            <form id="loginCandidatoForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Correo electrónico</label>
                <input type="email" class="form-control rounded-pill" id="candidatoEmail" placeholder="tu@email.com" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" class="form-control rounded-pill" id="candidatoPassword" placeholder="••••••" required>
              </div>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberCandidato">
                  <label class="form-check-label text-muted small">Recuérdame</label>
                </div>
                <a href="#" class="text-primary small text-decoration-none">¿Olvidaste tu contraseña?</a>
              </div>
              <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">Iniciar Sesión</button>
            </form>
          </div>

          <!-- Panel Empresa -->
          <div class="tab-pane fade" id="empresaPanel" role="tabpanel">
            <form id="loginEmpresaForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Correo corporativo</label>
                <input type="email" class="form-control rounded-pill" id="empresaEmail" placeholder="contacto@tuempresa.com" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" class="form-control rounded-pill" id="empresaPassword" placeholder="••••••" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">Acceder como Empresa</button>
            </form>
          </div>
        </div>

        <div class="text-center mt-4">
          <span class="text-muted">¿No tienes cuenta? </span>
          <a href="registro.html" id="openRegisterModal" class="text-primary fw-bold text-decoration-none">Regístrate gratis</a>
        </div>
      </div>
    </div>

    <div class="col-auto d-none d-md-block">
      <div class="icon-circle" id="iconEmpresa">
        <i class="bi bi-building"></i>
      </div>
    </div>
  </div>

  <!-- Redes sociales -->
<div class="row justify-content-center mt-5">
        <div class="col-md-6 text-center">
          <p class="text-muted mb-3">O accede con tus redes sociales</p>
          <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a
              href="https://accounts.google.com/v3/signin/identifier?continue=http%3A%2F%2Fsupport.google.com%2Faccounts%2Fanswer%2F27441%3Fhl%3Des%26co%3DGENIE.Platform%253DDesktop&dsh=S-1408268437%3A1776745180143585&ec=GAZAdQ&hl=es&passive=true&sjid=5777080546458114175-NA&flowName=GlifWebSignIn&flowEntry=ServiceLogin&ifkv=AT1y2_UN1r_YVaOgyIYe0CDQrYTZQbdxmKB98sRli3zhxG_uFv2b5CbKhZsW1yvv40GESz7Vivgs"
              target="_blank"
            >
              <button class="btn btn-social-google" id="socialGoogle">
                <i class="bi bi-google me-2"></i> Google
              </button></a
            >

            <a
              href="https://www.linkedin.com/login/es?fromSignIn=true&trk=guest_homepage-basic_nav-header-signin"
              target="_blank"
            >
              <button class="btn btn-social-linkedin" id="socialLinkedin">
                <i class="bi bi-linkedin me-2"></i> LinkedIn
              </button></a
            >
               <a
              href="https://www.facebook.com/?locale=es_LA"
              target="_blank"
            >
              <button class="btn btn-social-facebook" id="socialFacebook">
              <i class="bi bi-facebook me-2"></i> Facebook
            </button>
            
          </div>
        </div>
      </div>
</div>

<!-- Modal de Registro -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius: 32px;">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold">Crear cuenta nueva</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Tipo de cuenta</label>
            <select class="form-select rounded-pill" id="registerRole" required>
              <option value="candidato">Candidato (busco empleo)</option>
              <option value="empresa">Empresa (publico vacantes)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre completo / Razón social</label>
            <input type="text" class="form-control rounded-pill" id="registerName" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Correo electrónico</label>
            <input type="email" class="form-control rounded-pill" id="registerEmail" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Contraseña</label>
            <input type="password" class="form-control rounded-pill" id="registerPassword" required minlength="4">
          </div>
          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">Registrarse</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="toast-notification" id="liveToast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/login.js"></script>
</body>
</html>
