<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmpleoYa | Panel de Empresa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style-global.css"> 
  <link rel="stylesheet" href="css/style-empresa.css">
  <style>body { visibility: hidden; }</style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white py-3 shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary fs-3" href="index.html">Empleo<span class="text-dark">Ya</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarEmpresa">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarEmpresa">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0" id="navTabs">
        <li class="nav-item"><button class="nav-link active" data-tab="vacantes">Mis Vacantes</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="candidatos" id="tabCandidatos">Candidatos</button></li>
        <li class="nav-item"><a href="perfil.html" class="nav-link">Perfil Empresarial</a></li>
      </ul>
      <div class="d-flex gap-3 align-items-center">
        <div class="text-end d-none d-md-block">
            <small class="text-muted d-block" style="font-size: 0.7rem; font-weight: 700;">EMPRESA ACTIVADA</small>
            <span class="fw-bold text-primary" id="companyNameDisplay">AlexTech</span>
        </div>
        <button class="btn btn-outline-danger rounded-pill btn-sm px-3" id="btnLogout"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div id="vacantesTab" class="tab-content active-tab">
    <div class="row mb-4 align-items-center g-3">
      <div class="col-md-4">
        <h3 class="fw-bold mb-0"><i class="bi bi-briefcase-fill text-primary me-2"></i>Mis Vacantes</h3>
      </div>
      <div class="col-md-5">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 rounded-start-pill px-3"><i class="bi bi-search text-muted"></i></span>
          <input type="text" id="searchVacante" class="form-control border-start-0 rounded-end-pill py-2" placeholder="Filtrar por título de puesto...">
        </div>
      </div>
      <div class="col-md-3 text-md-end">
        <button class="btn btn-primary rounded-pill px-4 shadow-sm w-100 fw-bold" data-bs-toggle="modal" data-bs-target="#modalVacante">
          <i class="bi bi-plus-lg"></i> Publicar Oferta
        </button>
      </div>
    </div>
    <div id="vacantesContainer" class="row g-4">
      <div class="text-center w-100 py-5"><div class="spinner-border text-primary"></div></div>
    </div>
  </div>

  <div id="candidatosTab" class="tab-content" style="display: none;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold"><i class="bi bi-people-fill text-primary me-2"></i>Postulantes</h3>
      <span class="badge bg-light text-dark border py-2 px-3 rounded-pill" id="tituloVacanteCandidatos">Selecciona una vacante</span>
    </div>
    <div class="row g-4" id="candidatosContainer"></div>
  </div>
</main>

<div class="modal fade" id="modalVacante" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold">Gestionar Vacante</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formNuevaVacante">
          <input type="hidden" id="vVacanteId">
          
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label fw-semibold small">Título del puesto *</label>
              <input type="text" class="form-control rounded-pill" id="vTitulo" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold small">Modalidad *</label>
              <select class="form-select rounded-pill" id="vModalidad" required>
                <option value="PRESENCIAL">Presencial</option>
                <option value="REMOTO">Remoto</option>
                <option value="HIBRIDO">Híbrido</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Ubicación (Ciudad/País)</label>
              <input type="text" class="form-control rounded-pill" id="vUbicacion">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold small">Salario Mínimo</label>
              <input type="number" class="form-control rounded-pill" id="vSalarioMin">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold small">Salario Máximo</label>
              <input type="number" class="form-control rounded-pill" id="vSalarioMax">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold small">Descripción del puesto *</label>
              <textarea class="form-control rounded-4" rows="3" id="vDescripcion" required></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Requisitos *</label>
              <textarea class="form-control rounded-4" rows="3" id="vRequisitos" required></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Beneficios</label>
              <textarea class="form-control rounded-4" rows="3" id="vBeneficios"></textarea>
            </div>
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary rounded-pill py-2 fw-bold" id="btnSubmitVacante">Guardar Información</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/empresa.js"></script>
</body>
</html>
