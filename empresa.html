<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>EmpleoYa | Panel de Empresa</title>
  <!-- Bootstrap 5 + Icons + Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style-empresa.css">
</head>
<body>

<!-- Navbar Empresa -->
<nav class="navbar navbar-expand-lg bg-white py-3 shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#">Empleo<span class="text-primary">Ya</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarEmpresa">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarEmpresa">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0" id="navTabs">
        <li class="nav-item"><button class="nav-link active" data-tab="vacantes">Mis Vacantes</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="candidatos">Candidatos</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="perfil">Perfil Empresarial</button></li>
      </ul>
      <div class="d-flex gap-2 align-items-center">
        <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill" id="companyNameDisplay">TechCorp</span>
        <button class="btn btn-outline-danger rounded-pill" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">
  <!-- ========================= TAB VACANTES ========================= -->
  <div id="vacantesTab" class="tab-content active-tab">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <h3 class="fw-bold"><i class="bi bi-briefcase-fill text-primary me-2"></i>Mis Vacantes</h3>
      <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#modalVacante"><i class="bi bi-plus-lg"></i> Publicar nueva vacante</button>
    </div>

    <!-- Filtros -->
    <div class="row g-3 mb-4">
      <div class="col-md-5">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="text" id="searchVacante" class="form-control" placeholder="Buscar por título, empresa...">
        </div>
      </div>
      <div class="col-md-3">
        <select id="filterUbicacion" class="form-select">
          <option value="">Todas las ubicaciones</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="filterTipo" class="form-select">
          <option value="">Todos los tipos</option>
          <option>Tiempo completo</option>
          <option>Medio tiempo</option>
          <option>Freelance</option>
          <option>Prácticas</option>
        </select>
      </div>
      <div class="col-md-1">
        <button class="btn btn-outline-secondary w-100" id="resetFiltros"><i class="bi bi-arrow-repeat"></i></button>
      </div>
    </div>

    <div id="vacantesContainer" class="row g-4">
      <!-- Las vacantes se cargarán dinámicamente -->
    </div>
  </div>

  <!-- ========================= TAB CANDIDATOS ========================= -->
  <div id="candidatosTab" class="tab-content" style="display: none;">
    <h3 class="fw-bold mb-4"><i class="bi bi-people-fill text-primary me-2"></i>Candidatos recientes</h3>
    <div class="row g-4" id="candidatosContainer">
      <!-- Listado simulado -->
    </div>
  </div>

  <!-- ========================= TAB PERFIL EMPRESARIAL ========================= -->
  <div id="perfilTab" class="tab-content" style="display: none;">
    <div class="row">
      <div class="col-lg-8 mx-auto">
        <div class="card card-custom p-4">
          <h4 class="fw-bold mb-4"><i class="bi bi-building me-2 text-primary"></i>Información de la empresa</h4>
          <form id="companyProfileForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Nombre de la empresa</label>
              <input type="text" class="form-control rounded-pill" id="empresaNombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Correo de contacto</label>
              <input type="email" class="form-control rounded-pill" id="empresaEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Sitio web</label>
              <input type="url" class="form-control rounded-pill" id="empresaWeb" placeholder="https://">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Descripción</label>
              <textarea class="form-control" rows="4" id="empresaDescripcion"></textarea>
            </div>
            <button type="submit" class="btn btn-primary rounded-pill px-4">Guardar cambios</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="text-center text-muted py-4 border-top mt-5">
  <div class="container">EmpleoYa · Panel de gestión empresarial · © 2025</div>
</footer>

<!-- Modal para crear/editar vacante -->
<div class="modal fade" id="modalVacante" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="modalVacanteLabel">Publicar nueva vacante</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formVacante">
          <input type="hidden" id="vacanteId" value="">
          <div class="mb-3">
            <label class="form-label fw-semibold">Título del puesto</label>
            <input type="text" class="form-control rounded-pill" id="tituloVacante" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Empresa</label>
            <input type="text" class="form-control rounded-pill" id="empresaVacante" required>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Ubicación</label>
              <input type="text" class="form-control rounded-pill" id="ubicacionVacante" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Tipo de trabajo</label>
              <select class="form-select rounded-pill" id="tipoTrabajo" required>
                <option value="">Seleccionar</option>
                <option>Tiempo completo</option>
                <option>Medio tiempo</option>
                <option>Freelance</option>
                <option>Prácticas</option>
              </select>
            </div>
          </div>
          <div class="mb-3 mt-3">
            <label class="form-label fw-semibold">Salario (opcional)</label>
            <input type="text" class="form-control rounded-pill" id="salarioVacante" placeholder="Ej: $1500 - $2000">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Descripción</label>
            <textarea class="form-control" rows="4" id="descripcionVacante" required></textarea>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary rounded-pill py-2">Guardar vacante</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/empresa.js"></script>
</body>
</html>
